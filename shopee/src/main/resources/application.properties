spring.application.name=clotherwebsite

# Sửa lại dòng này: Khai báo host là localhost, cổng 3306, database là clotherwebsite
spring.datasource.url=jdbc:mysql://localhost:3306/clotherwebsite?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Nhập username và password khớp với lệnh docker chạy ở trên
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Phase 1 has no entities yet; validate avoids silently creating/changing schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true

# JWT signing key must be supplied via JWT_SECRET for real deployments.
app.jwt.secret=${JWT_SECRET:jkstCiGyF3HJYtdrTQZGilbzfhAejMVhllTgqtQ3zkw}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@localhost.com}
app.bootstrap-admin.password=${ADMIN_PASSWORD:admin}